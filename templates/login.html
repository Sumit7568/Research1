<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Depression Risk Screening</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    /* Gradient background: no hotlinked image, so it never breaks offline */
    background: linear-gradient(135deg, #1e3a8a, #4338ca 50%, #0f172a);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 35px;
    width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    color: white;
}

/* Heading */
.box h2 {
    margin-bottom: 5px;
}

.subtitle {
    font-size: 13px;
    margin-bottom: 20px;
    opacity: 0.8;
}

/* Input fields */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 14px;
}

input::placeholder {
    color: #eee;
}

/* Focus effect */
input:focus {
    background: rgba(255,255,255,0.3);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #ffffff;
    color: #667eea;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #f1f1f1;
    transform: scale(1.02);
}

/* Error */
.error {
    color: #ffb3b3;
    font-size: 13px;
    margin-bottom: 10px;
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="box">

    <h2>Welcome Back</h2>
    <p class="subtitle">Machine Learning Depression Risk Screening</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="👤 Username" required>
        <input type="password" name="password" placeholder="🔒 Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        <p>Research prototype. Screening aid only, not a medical diagnosis.</p>
    </div>

</div>

</body>
</html>
